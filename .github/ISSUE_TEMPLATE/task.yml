# A task inside a project. The site lists it on the project's page; comment "/take"
# to take it on, close it when it's done.
name: Add a task to a project
description: A piece of work someone can pick up.
title: "[Task] "
labels: [task]
body:
  - type: input
    id: project
    attributes:
      label: Project
      description: The project's issue number, for example 42 (filled in by the site).
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What needs doing
    validations:
      required: true
  - type: input
    id: skills
    attributes:
      label: Skills that help
      description: Optional, for example "Python, power systems".
