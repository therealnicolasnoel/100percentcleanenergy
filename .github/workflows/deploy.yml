# Builds the site and publishes it to GitHub Pages whenever main changes, and when
# a project, task or comment changes (projects live in issues).
# Enable it once: repo Settings → Pages → Source: GitHub Actions.
name: Deploy reports site

on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Issue events only matter for projects and tasks.
    if: >-
      github.event_name != 'issues' && github.event_name != 'issue_comment' ||
      contains(github.event.issue.labels.*.name, 'project') ||
      contains(github.event.issue.labels.*.name, 'task')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_GITHUB_REPO: ${{ github.repository }}
          PUBLIC_GITHUB_BRANCH: ${{ github.event.repository.default_branch }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
