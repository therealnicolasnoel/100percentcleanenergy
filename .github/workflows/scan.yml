# Re-scans the field for every problem with a scan.json and opens a pull request
# with the changes to problems/*/field/. Merging it publishes the new data.
#
# One-time setup: Settings → Actions → General → Workflow permissions →
# "Allow GitHub Actions to create and approve pull requests".
# Optional secrets: OPENALEX_API_KEY (higher OpenAlex limits), ANTHROPIC_API_KEY
# (needed for the Claude review option).
name: Scan the field

on:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      problem:
        description: 'Problem folder (for example 11-clean-electricity), or "all"'
        default: all
      claude_review:
        description: 'Review matches with Claude (uses the ANTHROPIC_API_KEY secret; capped at $5 per run)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: field-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: scanner/.cache
          key: scan-cache-${{ github.run_id }}
          restore-keys: scan-cache-
      - name: Scan
        run: npm run scan -- ${{ inputs.problem || 'all' }} ${{ inputs.claude_review && '--llm' || '' }} --summary=scan-summary.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCAN_LLM_MAX_USD: '5'
      - name: Check the site still builds
        run: npm run build
        env:
          PUBLIC_GITHUB_REPO: ${{ github.repository }}
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
          RUN: ${{ github.run_number }}
        run: |
          if git diff --quiet -- problems; then echo "No changes to the field data."; exit 0; fi
          day=$(date -u +%Y-%m-%d)
          branch="scan/${day}-${RUN}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add problems/*/field
          git commit -m "Field scan ${day}"
          git push -u origin "$branch"
          gh pr create --base "$BASE" --head "$branch" --title "Field scan ${day}" --body-file scan-summary.md
